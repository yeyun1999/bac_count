name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-exe.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: bac_count_windows
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: bac_count.exe
          generate_release_notes: true
