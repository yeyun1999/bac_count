on:
  push:
    branches:
      - main
      - release/*
    

jobs:
  build:
    runs-on: windows-latest

    steps:

      # Check-out repository
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
        
      - name: Install python
        run: uv sync --frozen; uv pip install nuitka[all]
          
      - name: Nuitka build
        run: | 
          uv run python -m nuitka src/bac_count `
          --mode=onefile `
          --output-dir=build `
          --enable-plugins=pyside6 `
          --windows-console-mode=disable `
          --assume-yes-for-downloads `
          --remove-output `
          --lto=yes
        
      # Uploads artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bac_count_windows
          path: build/bac_count.exe
          include-hidden-files: true
