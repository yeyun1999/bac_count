name: Tests

on:
  push:
    branches:
      - main
      - release/*
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Qt offscreen system libs
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Sync deps
        run: uv sync --frozen

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q
